<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/img/favicon.svg">
<title>Nube Lab — making of</title>
<!--
  Motion "making of" (6 s): 3 vídeos de bastidor num carrossel de cards (referência do Pinterest + leque do hero).
  No fim os cards caem e fica só o fundo índigo, para emendar com a assinatura.
  A assinatura com o Nubinho é outro vídeo: assinatura.html.
  Abrir: http://localhost:5510/making-of/making-of.html
  Render: na pasta vinheta-podcast/render,
    node render.mjs --name making-of --url http://localhost:5510/making-of/making-of.html
  A linha do tempo é determinística: o render.mjs chama window.__seek(t) quadro a quadro
  (aqui o __seek também posiciona os vídeos e espera o quadro certo aparecer).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=block">
<style>
  @font-face { font-family: "Sugo"; src: url("../assets/fonts/sugo.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  :root {
    --roxo: #4e24f1; --limao: #d2d641; --lilas: #e698fd;
    --ink: #1a1a1a; --paper: #f2f2f2;
    --f-display: "Sugo", "Dosis", "Arial Narrow", sans-serif;
    --f-body: "Montserrat", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #0d0d0d; overflow: hidden; }
  body { display: grid; place-items: center; }

  .stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; flex: none;
    background: var(--limao); color: var(--ink); font-family: var(--f-body); transform-origin: 50% 50%;
  }

  .bigword {
    position: absolute; left: 50%; top: 50%; translate: -50% -52%;
    font-family: var(--f-display); font-weight: 900; line-height: .8; white-space: nowrap;
    font-size: 520px; color: var(--ink); opacity: .07;
  }
  .eyebrow {
    position: absolute; left: 50%; top: 58px; translate: -50% 0; z-index: 3;
    font-weight: 700; font-size: 22px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
    display: inline-flex; align-items: center; gap: .7em; color: var(--ink);
  }
  .eyebrow i { width: .55em; height: .55em; border-radius: 50%; background: var(--roxo); }

  .card {
    position: absolute; left: 50%; top: 50%; width: 560px; height: 560px;
    border-radius: 22px; overflow: hidden; background: var(--paper);
    display: flex; flex-direction: column;
    box-shadow: 0 30px 60px rgba(26, 26, 26, .2);
  }
  .card video, .card canvas { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: cover; display: block; background: var(--ink); }
  /* no render o quadro é desenhado num canvas; o vídeo fica só como fonte */
  .card video.src { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  .cap {
    flex: 0 0 auto; height: 0; overflow: hidden; padding: 0 30px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .cap-title { display: flex; font-family: var(--f-display); font-weight: 800; font-size: 66px; line-height: 1; color: var(--ink); }
  .cap-title .m { display: inline-block; overflow: hidden; padding-top: .2em; margin-top: -.2em; padding-bottom: .12em; margin-bottom: -.12em; }
  .cap-title .m > span { display: inline-block; white-space: pre; }
  .cap-num { font-weight: 700; font-size: 18px; letter-spacing: .14em; color: #5e5e5e; white-space: nowrap; }

  .sticker {
    position: absolute; z-index: 6; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
    padding: 14px 22px; border-radius: 20px; background: #fff; color: var(--ink);
    font-weight: 700; font-size: 24px; box-shadow: 0 14px 34px rgba(0, 0, 0, .22);
  }
  .rec-dot { width: .5em; height: .5em; border-radius: 50%; background: #ff3b30; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bigword" id="bigword">bastidor</div>
  <p class="eyebrow" id="eyebrow"><i id="eyebrowDot"></i>making of · nube lab</p>
  <div id="cards"></div>
  <span class="sticker" id="rec" style="left:1170px;top:150px"><i class="rec-dot"></i>gravando</span>
</div>

<script src="../assets/js/vendor/gsap.min.js"></script>
<script>
(() => {
  /* ======== CONFIGURAÇÃO ========
     Trocar pelos 3 vídeos do Drive (salvos em making-of/videos/).
     src: arquivo · from: segundo do vídeo onde começa o trecho · legenda: até 3 palavras, caixa baixa.
     Todos os cards tocam o tempo todo (os laterais também): escolha trechos com uns 6 s de movimento.
     Provisório: reels do site, nos trechos com mais movimento, só para o motion já rodar. */
  const VIDEOS = [
    { src: "../assets/video/reels/institucional.mp4", from: 16, legenda: "roteiro" },
    { src: "../assets/video/reels/dr-mauricio.mp4", from: 8, legenda: "gravação" },
    { src: "../assets/video/reels/aimer-joias.mp4", from: 26, legenda: "edição" },
  ];
  const BG = ["#d2d641", "#e698fd", "#4e24f1"];   // fundo enquanto cada vídeo está no centro

  const params = new URLSearchParams(location.search);
  const render = params.has("render");
  const W = 1920, H = 1080;
  const stage = document.getElementById("stage");
  const $ = (s) => document.querySelector(s);

  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = k < 1 ? `scale(${k})` : ""; };
  fit(); addEventListener("resize", fit);

  /* carrossel em fita: [3, 1, 2, 3, 1], para sempre haver card dos dois lados */
  const strip = [2, 0, 1, 2, 0];
  const cards = strip.map((v, i) => {
    const d = VIDEOS[v];
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<video muted playsinline preload="auto"></video>
      <div class="cap"><span class="cap-title">${[...d.legenda].map((ch) => `<span class="m"><span>${ch}</span></span>`).join("")}</span><span class="cap-num">0${v + 1}/03</span></div>`;
    $("#cards").appendChild(el);
    // as cópias das pontas da fita começam noutro trecho, para não repetir o mesmo quadro na tela
    const dup = i === 0 || i === 4;
    return { el, src: d.src, video: el.querySelector("video"), cap: el.querySelector(".cap"), letters: el.querySelectorAll(".m > span"), from: d.from + (dup ? 8 : 0) };
  });

  /* ---------- linha do tempo (6 s) ---------- */
  // cards juntos, os laterais por trás do central (como na referência); só 3 aparecem por vez
  const SP = 430, CARD_H = 560, CAP_H = 170;
  const state = (rel) => {
    const a = Math.abs(rel);
    if (a === 0) return { x: 0, y: 0, scale: 1, rotation: 0, autoAlpha: 1, zIndex: 3 };
    if (a === 1) return { x: rel * SP, y: 0, scale: 0.8, rotation: 0, autoAlpha: 1, zIndex: 2 };
    return { x: rel * SP * 1.6, y: 0, scale: 0.6, rotation: 0, autoAlpha: 0, zIndex: 1 };
  };

  const build = () => {
    const tl = gsap.timeline({ paused: true, defaults: { ease: "power4.out" } });
    const capIn = (c, at) => {
      tl.to(c.cap, { height: CAP_H, duration: 0.4, ease: "expo.out" }, at)
        .to(c.letters, { yPercent: 0, duration: 0.45, stagger: 0.025, ease: "expo.out" }, at + 0.08);
    };

    /* 1. entrada: "bastidor" ao fundo, cards sobem em leque elástico */
    let center = 1;
    cards.forEach((c, i) => {
      gsap.set(c.el, { xPercent: -50, yPercent: -50, ...state(i - center), height: CARD_H });
      gsap.set(c.letters, { yPercent: 115 });
    });
    gsap.set("#bigword", { yPercent: 40, autoAlpha: 0 });
    gsap.set("#eyebrow", { y: -30, autoAlpha: 0 });
    gsap.set("#rec", { scale: 0, rotation: -25 });
    tl.to("#bigword", { yPercent: 0, autoAlpha: 0.07, duration: 1.0, ease: "expo.out" }, 0);
    [1, 0, 2].forEach((i, k) => {
      tl.from(cards[i].el, { y: 700, scale: 0.7, rotation: (i - center) * 10, duration: 0.9, ease: "elastic.out(1, .8)" }, 0.05 + k * 0.06);
    });
    tl.to(cards[center].el, { height: CARD_H + CAP_H, duration: 0.45, ease: "expo.out" }, 0.45);
    capIn(cards[center], 0.45);
    tl.to("#eyebrow", { y: 0, autoAlpha: 1, duration: 0.6, ease: "expo.out" }, 0.3)
      .to("#rec", { scale: 1, rotation: 6, duration: 0.7, ease: "back.out(2.6)" }, 0.6)
      .to(".rec-dot", { opacity: 0, duration: 0.01, repeat: 9, yoyo: true, repeatDelay: 0.24, ease: "none" }, 0.8);

    /* 2. trocas: a fita anda um card para a esquerda e o fundo troca de cor */
    const swap = (at, k) => {
      const prev = cards[center];
      center += 1;
      const next = cards[center];
      tl.to(prev.cap, { height: 0, duration: 0.25, ease: "power2.in" }, at)
        .to(prev.el, { height: CARD_H, duration: 0.25, ease: "power2.in" }, at);
      cards.forEach((c, i) => {
        const { zIndex, ...s } = state(i - center);
        // a troca de camada acontece no meio do deslize, quando os cards se cruzam
        tl.to(c.el, { ...s, duration: 0.5, ease: "power3.inOut" }, at).set(c.el, { zIndex }, at + 0.2);
      });
      tl.to(next.el, { height: CARD_H + CAP_H, duration: 0.4, ease: "expo.out" }, at + 0.25);
      capIn(next, at + 0.28);
      const dark = BG[k] === "#4e24f1";
      tl.to(stage, { backgroundColor: BG[k], duration: 0.5, ease: "power3.inOut" }, at)
        .to(["#bigword", "#eyebrow"], { color: dark ? "#f2f2f2" : "#1a1a1a", duration: 0.5, ease: "power3.inOut" }, at)
        .to("#eyebrowDot", { backgroundColor: dark ? "#d2d641" : "#4e24f1", duration: 0.5 }, at)
        .to("#bigword", { xPercent: -6 * k, duration: 0.6, ease: "power3.inOut" }, at);
    };
    swap(1.8, 1);
    swap(3.45, 2);

    /* 3. saída: os cards tomam impulso e caem para fora da tela (laterais primeiro, o central por último),
       deixando o fundo índigo limpo, a mesma cor em que a assinatura começa */
    const E = 5.2;
    [center - 1, center + 1, center].forEach((i, k) => {
      const side = Math.sign(i - center) || 1;
      tl.to(cards[i].el, { keyframes: [
        { y: -28, duration: 0.14, ease: "power2.out" },
        { y: 1000, rotation: side * 14, duration: 0.45, ease: "power3.in" },
      ] }, E + k * 0.07);
    });
    tl.to(["#eyebrow", "#rec"], { y: -160, autoAlpha: 0, duration: 0.35, stagger: 0.04, ease: "power2.in" }, E)
      .to("#bigword", { yPercent: -40, autoAlpha: 0, duration: 0.6, ease: "power2.in" }, E);

    tl.to({}, { duration: 0.01 }, 5.99);
    return tl;
  };

  /* vídeos: todos rodam desde o início. No render cada quadro posiciona o vídeo no tempo certo e copia
     esse quadro para um canvas (o print de um <video> pausado às vezes repete o quadro anterior e o vídeo parece parado) */
  const videoTime = (c, t) => Math.min(c.from + t, Math.max(0, (c.video.duration || 0) - 0.05));
  const useCanvas = () => cards.forEach((c) => {
    c.canvas = document.createElement("canvas");
    c.canvas.width = c.video.videoWidth; c.canvas.height = c.video.videoHeight;
    c.ctx = c.canvas.getContext("2d");
    c.video.classList.add("src");
    c.video.before(c.canvas);
  });
  const seekVideo = (c, t) => new Promise((ok) => {
    const v = c.video, want = videoTime(c, t);
    const draw = () => { c.ctx.drawImage(v, 0, 0, c.canvas.width, c.canvas.height); ok(); };
    if (Math.abs(v.currentTime - want) < 0.001 && c.drawn) return draw();
    c.drawn = true;
    v.addEventListener("seeked", draw, { once: true });
    v.currentTime = want;
  });
  // o vídeo é baixado inteiro antes: servidores simples (python -m http.server) não aceitam pular para o meio do arquivo
  const loaded = async (c) => {
    const blob = await fetch(c.src).then((r) => r.blob());
    await new Promise((ok) => { c.video.addEventListener("loadeddata", ok, { once: true }); c.video.src = URL.createObjectURL(blob); });
  };

  Promise.all([document.fonts.load('900 1em "Sugo"'), document.fonts.load('700 1em "Montserrat"')]).catch(() => {})
    .then(() => document.fonts.ready)
    .then(() => Promise.all(cards.map(loaded)))
    .then(() => {
      const tl = build();
      if (render) useCanvas();
      window.__duration = tl.duration();
      window.__seek = async (t) => {
        tl.seek(t, false);
        await Promise.all(cards.map((c) => seekVideo(c, t)));
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        return true;
      };
      window.__ready = true;
      if (!render) {
        // prévia: vídeos tocam soltos; clique repete
        const start = () => { cards.forEach((c) => { c.video.currentTime = c.from; c.video.play().catch(() => {}); }); tl.restart(); };
        start();
        document.addEventListener("click", start);
      }
    });
})();
</script>
</body>
</html>
